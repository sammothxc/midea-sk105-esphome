esphome:
  name: sk105
  friendly_name: SK105
  platformio_options:
    lib_compat_mode: "off"   # MideaUART's manifest only declares Espressif
    build_flags:
      - -DPIN_SERIAL0_RX=13u
      - -DPIN_SERIAL0_TX=14u

rtl87xx:
  board: generic-rtl8720cf-2mb-992k   # some SK10x might be 896k; match the stock partition layout

external_components:
  - source:
      type: local
      path: components
    components: [midea]

logger:

api:
  encryption:
    key: !secret sk105__encryption_key

ota:
  - platform: esphome
    password: !secret sk105__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: SK105 Fallback Hotspot
    password: !secret sk105__ota_password

captive_portal:

uart:
  tx_pin: PA14
  rx_pin: PA13
  baud_rate: 9600

climate:
  - platform: midea
    name: Midea AC
    autoconf: true
